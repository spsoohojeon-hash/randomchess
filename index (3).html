<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>랜덤능력체스</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="manifest" href="manifest.json">

  <meta name="theme-color" content="#17182b">
  <meta name="mobile-web-app-capable" content="yes">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="랜덤체스">

  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<section id="menu" class="screen">
  <div class="logo">♟</div>
  <h1>랜덤능력체스</h1>
  <p>체크 없이 킹을 잡으면 승리</p>

  <div class="panel">
    <h2>계정</h2>
    <div id="loginState" class="loginState">로그인 안 됨</div>

    <input id="nickInput" placeholder="닉네임">
    <input id="passInput" placeholder="비밀번호" type="password">

    <button onclick="Game.loginNickname()">닉네임 로그인 / 가입</button>
    <button onclick="Game.loginGoogle()">Google 로그인</button>
    <button onclick="Game.logout()">로그아웃</button>
  </div>

  <button class="bigBtn" onclick="Game.startLocal()">로컬 2인 플레이</button>

  <div class="panel">
    <h2>온라인 방 만들기</h2>

    <input id="roomNameInput" placeholder="방 이름">
    <input id="roomPasswordInput" placeholder="비밀번호 선택사항" type="password">

    <label class="checkLine">
      <input id="privateRoomInput" type="checkbox">
      비공개 방
    </label>

    <button onclick="Game.createOnlineRoom()">방 만들기</button>
  </div>

  <div class="panel">
    <h2>온라인 방 찾기</h2>
    <button onclick="Game.refreshRooms()">방 목록 새로고침</button>
    <div id="roomList" class="listBox"></div>
  </div>

  <div class="panel">
    <h2>친구</h2>

    <input id="friendInput" placeholder="친구 닉네임 또는 UID">

    <button onclick="Game.addFriend()">친구 추가</button>
    <button onclick="Game.refreshFriends()">친구 목록 새로고침</button>

    <div id="friendList" class="listBox"></div>
  </div>
</section>

<section id="game" class="game hidden">
  <header>
    <button onclick="Game.backMenu()">메뉴</button>
    <button onclick="Game.resign()">기권</button>
    <button onclick="Game.copyInvite()">초대복사</button>
  </header>

  <div id="status">대기중</div>
  <div id="cardArea"></div>
  <div id="board"></div>
</section>

<div id="joinModal" class="hidden modal">
  <div class="promoBox">
    <h3 id="joinTitle">방 입장</h3>
    <input id="joinPasswordInput" placeholder="방 비밀번호" type="password">
    <button onclick="Game.confirmJoinRoom()">입장</button>
    <button onclick="Game.closeJoinModal()">취소</button>
  </div>
</div>

<div id="promotionModal" class="hidden modal">
  <div class="promoBox">
    <h3>승급 선택</h3>
    <button onclick="Game.choosePromotion('q')">퀸</button>
    <button onclick="Game.choosePromotion('r')">룩</button>
    <button onclick="Game.choosePromotion('b')">비숍</button>
    <button onclick="Game.choosePromotion('n')">나이트</button>
  </div>
</div>

<div id="necroModal" class="hidden modal cardSelectModal">
  <div class="promoBox">
    <h3>네크로맨서 - 부활할 기물 선택</h3>
    <p class="modalDesc">내가 잡은 상대 기물 중 하나를 선택하세요.</p>
    <div id="necroList"></div>
    <button onclick="Game.cancelCardSelection()">취소</button>
  </div>
</div>

<div id="exorcismModal" class="hidden modal cardSelectModal">
  <div class="promoBox">
    <h3>퇴마(물리) - 비숍 선택</h3>
    <p class="modalDesc">능력을 사용할 내 비숍을 선택하세요.</p>
    <div id="exorcismList"></div>
    <button onclick="Game.cancelCardSelection()">취소</button>
  </div>
</div>

<div id="reactionaryModal" class="hidden modal cardSelectModal">
  <div class="promoBox">
    <h3>반동분자 - 왕룩 선택</h3>
    <p class="modalDesc">킹이 잡혔을 때 왕룩으로 삼을 내 룩을 선택하세요.</p>
    <div id="reactionaryList"></div>
    <button onclick="Game.cancelCardSelection()">취소</button>
  </div>
</div>

<div id="spaceModal" class="hidden modal cardSelectModal">
  <div class="promoBox">
    <h3>우주여행 - 텔레포트 기물 선택</h3>
    <p class="modalDesc">상대 진영 코너에 도착한 내 기물을 선택하세요.</p>
    <div id="spaceList"></div>
    <button onclick="Game.cancelCardSelection()">취소</button>
  </div>
</div>

<script type="module" src="app.js"></script>

<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js")
        .then(() => console.log("Service Worker registered"))
        .catch(err => console.log("Service Worker error:", err));
    });
  }
</script>

</body>
</html>
