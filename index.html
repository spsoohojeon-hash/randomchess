<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>랜덤능력체스</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="manifest" href="manifest.json">

  <meta name="theme-color" content="#17182b">
  <meta name="mobile-web-app-capable" content="yes">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="랜덤체스">

  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<section id="menu" class="screen">
  <div class="logo">♟</div>
  <h1>랜덤능력체스</h1>
  <p>체크 없이 킹을 잡으면 승리</p>

  <div id="loginBox" class="loginBox">
    <h2>계정</h2>
    <input id="nicknameInput" placeholder="닉네임 입력">
    <button onclick="Game.loginNickname()">닉네임으로 시작</button>
    <button onclick="Game.loginGoogle()">Google 로그인</button>
    <p id="loginStatus">로그인 안 됨</p>
  </div>

  <button class="bigBtn" onclick="Game.startLocal()">로컬 2인 플레이</button>

  <div class="onlineBox">
    <h2>온라인 방 만들기</h2>
    <input id="roomNameInput" placeholder="방 이름">
    <input id="roomPasswordInput" placeholder="비밀번호 선택사항" type="password">
    <label class="checkLine">
      <input id="privateRoomCheck" type="checkbox">
      비공개 방
    </label>
    <button onclick="Game.createOnlineRoom()">방 만들기</button>
  </div>

  <div class="onlineBox">
    <h2>방 코드로 입장</h2>
    <input id="inviteCodeInput" placeholder="초대코드 입력">
    <input id="invitePasswordInput" placeholder="비밀번호 있으면 입력" type="password">
    <button onclick="Game.joinByInviteCode()">초대코드 입장</button>
  </div>

  <div class="onlineBox">
    <h2>온라인 방찾기</h2>
    <button onclick="Game.refreshRooms()">방 목록 새로고침</button>
    <div id="roomList" class="roomList"></div>
  </div>
</section>

<section id="game" class="game hidden">
  <header>
    <button onclick="Game.backMenu()">메뉴</button>
    <button onclick="Game.resign()">기권</button>
    <button onclick="Game.copyInviteCode()">초대코드 복사</button>
  </header>

  <div id="status">대기중</div>
  <div id="cardArea"></div>
  <div id="board"></div>
</section>

<div id="passwordModal" class="hidden cardSelectModal">
  <div class="promoBox">
    <h3>비밀번호 입력</h3>
    <p id="passwordRoomTitle" class="modalDesc"></p>
    <input id="passwordModalInput" placeholder="비밀번호" type="password">
    <button onclick="Game.submitRoomPassword()">입장</button>
    <button onclick="Game.cancelPasswordModal()">취소</button>
  </div>
</div>

<div id="promotionModal" class="hidden">
  <div class="promoBox">
    <h3>승급 선택</h3>
    <button onclick="Game.choosePromotion('q')">퀸</button>
    <button onclick="Game.choosePromotion('r')">룩</button>
    <button onclick="Game.choosePromotion('b')">비숍</button>
    <button onclick="Game.choosePromotion('n')">나이트</button>
  </div>
</div>

<div id="necroModal" class="hidden cardSelectModal">
  <div class="promoBox">
    <h3>네크로맨서 - 부활할 기물 선택</h3>
    <p class="modalDesc">내가 잡은 상대 기물 중 하나를 선택하세요.</p>
    <div id="necroList"></div>
    <button onclick="Game.cancelCardSelection()">취소</button>
  </div>
</div>

<div id="exorcismModal" class="hidden cardSelectModal">
  <div class="promoBox">
    <h3>퇴마(물리) - 비숍 선택</h3>
    <p class="modalDesc">능력을 사용할 내 비숍을 선택하세요.</p>
    <div id="exorcismList"></div>
    <button onclick="Game.cancelCardSelection()">취소</button>
  </div>
</div>

<div id="reactionaryModal" class="hidden cardSelectModal">
  <div class="promoBox">
    <h3>반동분자 - 왕룩 선택</h3>
    <p class="modalDesc">왕룩으로 지정할 내 룩을 선택하세요.</p>
    <div id="reactionaryList"></div>
    <button onclick="Game.cancelCardSelection()">취소</button>
  </div>
</div>

<div id="spaceModal" class="hidden cardSelectModal">
  <div class="promoBox">
    <h3>우주여행 - 텔레포트 기물 선택</h3>
    <p class="modalDesc">상대 진영 코너에 도착한 내 기물을 선택하세요.</p>
    <div id="spaceList"></div>
    <button onclick="Game.cancelCardSelection()">취소</button>
  </div>
</div>

<script type="module" src="app.js"></script>

<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js")
        .then(() => console.log("Service Worker registered"))
        .catch(err => console.log("Service Worker error:", err));
    });
  }
</script>

</body>
</html>
