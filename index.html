<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>랜덤능력체스</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#17182b">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="랜덤체스">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<section id="menu" class="screen">
  <div class="logo">♟</div>
  <h1>랜덤능력체스</h1>
  <p>체크 없이 킹을 잡으면 승리</p>

  <button class="bigBtn" onclick="Game.startLocal()">로컬 2인 플레이</button>

  <div class="panel">
    <h2>온라인 플레이</h2>
    <input id="roomInput" placeholder="방 코드 입력">
    <button onclick="Game.makeRoom()">방 만들기</button>
    <button onclick="Game.joinOnline()">방 입장</button>
  </div>
</section>

<section id="game" class="game hidden">
  <header>
    <button onclick="Game.backMenu()">메뉴</button>
    <button onclick="Game.resign()">기권</button>
  </header>
  <div id="status">대기중</div>
  <div id="cardArea"></div>
  <div id="board"></div>
</section>

<div id="promotionModal" class="hidden modal">
  <div class="promoBox">
    <h3>승급 선택</h3>
    <button onclick="Game.choosePromotion('q')">퀸</button>
    <button onclick="Game.choosePromotion('r')">룩</button>
    <button onclick="Game.choosePromotion('b')">비숍</button>
    <button onclick="Game.choosePromotion('n')">나이트</button>
  </div>
</div>

<div id="necroModal" class="hidden modal cardSelectModal">
  <div class="promoBox">
    <h3>네크로맨서 - 부활할 기물 선택</h3>
    <p class="modalDesc">내가 잡은 상대 기물 중 하나를 선택하세요.</p>
    <div id="necroList"></div>
    <button onclick="Game.cancelCardSelection()">취소</button>
  </div>
</div>

<div id="exorcismModal" class="hidden modal cardSelectModal">
  <div class="promoBox">
    <h3>퇴마(물리) - 비숍 선택</h3>
    <p class="modalDesc">능력을 사용할 내 비숍을 선택하세요.</p>
    <div id="exorcismList"></div>
    <button onclick="Game.cancelCardSelection()">취소</button>
  </div>
</div>

<div id="reactionaryModal" class="hidden modal cardSelectModal">
  <div class="promoBox">
    <h3>반동분자 - 왕룩 선택</h3>
    <p class="modalDesc">킹이 잡혔을 때 왕룩으로 삼을 내 룩을 선택하세요.</p>
    <div id="reactionaryList"></div>
    <button onclick="Game.cancelCardSelection()">취소</button>
  </div>
</div>

<div id="spaceModal" class="hidden modal cardSelectModal">
  <div class="promoBox">
    <h3>우주여행 - 텔레포트 기물 선택</h3>
    <p class="modalDesc">상대 진영 코너에 도착한 내 기물을 선택하세요.</p>
    <div id="spaceList"></div>
    <button onclick="Game.cancelCardSelection()">취소</button>
  </div>
</div>

<div id="choiceResultModal" class="hidden modal cardSelectModal">
  <div class="promoBox">
    <h3 id="choiceResultTitle">선택</h3>
    <p id="choiceResultDesc" class="modalDesc">결과를 선택하세요.</p>
    <button onclick="Game.chooseResultOption('opponentWin')">상대 승리</button>
    <button onclick="Game.chooseResultOption('opponentLose')">상대 패배</button>
  </div>
</div>

<div id="quickDuelModal" class="hidden modal cardSelectModal">
  <div class="promoBox">
    <h3>속전속결 - 묵찌빠</h3>
    <p id="quickDuelStatus" class="modalDesc">3판 2선승제입니다.</p>
    <div class="quickDuelButtons">
      <button onclick="Game.chooseQuickDuel('rock')">묵</button>
      <button onclick="Game.chooseQuickDuel('scissors')">찌</button>
      <button onclick="Game.chooseQuickDuel('paper')">빠</button>
    </div>
  </div>
</div>

<div id="undoMoveModal" class="hidden modal cardSelectModal">
  <div class="promoBox">
    <h3 id="undoMoveTitle">무르기</h3>
    <p id="undoMoveDesc" class="modalDesc">수를 무르겠습니까?</p>
    <button onclick="Game.confirmUndoMove()">무르기</button>
    <button onclick="Game.closeUndoMoveModal()">취소</button>
  </div>
</div>

<script type="module" src="app.js?v=71"></script>

<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js")
        .then(() => console.log("Service Worker registered"))
        .catch(err => console.log("Service Worker error:", err));
    });
  }
</script>

</body>
</html>
