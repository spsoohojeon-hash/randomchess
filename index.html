<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>랜덤능력체스</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="menu" class="screen">
    <div class="logo">♟</div>
    <h1>랜덤능력체스</h1>
    <p>게임 모드를 선택하세요</p>

    <button class="main-btn" id="localBtn">로컬 2인 플레이</button>
    <button class="main-btn online" id="onlineBtn">온라인 멀티플레이</button>
  </main>

  <main id="onlineMenu" class="screen hidden">
    <h1>온라인 멀티플레이</h1>

    <button class="main-btn online" id="makeRoomBtn">방 만들기</button>

    <div class="room-box">
      <input id="roomInput" placeholder="방 코드 입력">
      <button id="joinRoomBtn">방 입장</button>
    </div>

    <button class="sub-btn" id="onlineBackBtn">뒤로</button>
  </main>

  <main id="game" class="hidden">
    <header>
      <button id="backBtn">메뉴</button>
      <button id="resetBtn">리셋</button>
    </header>

    <section id="status">대기중</section>
    <section id="board"></section>
  </main>

  <script src="app.js"></script>
</body>
</html>
